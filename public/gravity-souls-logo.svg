<svg xmlns="http://www.w3.org/2000/svg" width="390" height="104" viewBox="0 0 390 104" role="img" aria-labelledby="logo-title logo-desc">
<title id="logo-title">Gravity Souls galaxy logo</title>
<desc id="logo-desc">A spiral galaxy beside the Gravity Souls wordmark.</desc>
<svg x="0" y="0" width="104" height="104" viewBox="0 0 128 128">
